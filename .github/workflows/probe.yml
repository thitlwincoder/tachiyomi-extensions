name: Probe Plugin

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe maven metadata
        run: |
          for url in \
            "https://jitpack.io/com/github/tachiyomiorg/extensions-lib/master/extensions-lib-master.pom" \
            "https://jitpack.io/com/github/keiyoushi/extensions-lib/18a8e26be2/extensions-lib-18a8e26be2.pom" \
            "https://jitpack.io/com/github/keiyoushi/extensions-lib/6e0c96cea8/extensions-lib-6e0c96cea8.pom" ; do
            echo "=== $url ==="
            curl -sL --max-time 40 "$url" -w "\nHTTP:%{http_code}\n" || echo "FAILED"
            echo
          done
