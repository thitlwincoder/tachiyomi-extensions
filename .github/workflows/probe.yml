name: Probe Plugin
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts
        run: |
          for u in \
            "https://maven.tachiyomi.org/tachiyomi/extension/tachiyomi.extension.gradle.plugin/maven-metadata.xml" \
            "https://repo.mihon.app/tachiyomi/extension/tachiyomi.extension.gradle.plugin/maven-metadata.xml" \
            "https://maven.keiyoushi.dev/io/github/keiyoushi/gradle/extension/io.github.keiyoushi.gradle.extension.gradle.plugin/maven-metadata.xml" \
            "https://maven.keiyoushi.dev/" \
            "https://www.jitpack.io/com/github/tachiyomiorg/extensions-lib/maven-metadata.xml" \
            "https://plugins.gradle.org/m2/tachiyomi/extension/tachiyomi.extension.gradle.plugin/maven-metadata.xml" ; do
            code=$(curl -s -o /tmp/o -w "%{http_code}" -L --max-time 25 "$u")
            echo "$code  $u"
            if [ "$code" = "200" ]; then echo "----- body -----"; head -c 500 /tmp/o; echo; fi
          done
